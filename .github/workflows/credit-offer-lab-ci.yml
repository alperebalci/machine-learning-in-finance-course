name: Credit offer learn-then-optimize tests

on:
  push:
    paths:
      - 'projects/credit-offer-predict-then-optimize/**'
      - 'tests/test_credit_offer_predict_optimize.py'
      - '.github/workflows/credit-offer-lab-ci.yml'
  pull_request:
    paths:
      - 'projects/credit-offer-predict-then-optimize/**'
      - 'tests/test_credit_offer_predict_optimize.py'
      - '.github/workflows/credit-offer-lab-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight dependencies
        run: python -m pip install "numpy>=2.0" "pandas>=2.2" "scipy>=1.14" "scikit-learn>=1.5" "pytest>=8"
      - name: Test synthetic credit offer lab
        run: python -m pytest -q tests/test_credit_offer_predict_optimize.py
